<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loopback queue</title>
    <script>
      // Resolve the theme before first paint — a class applied after hydration
      // is the flash-of-wrong-theme bug this project has filed against others.
      (function () {
        try {
          var s = localStorage.getItem("lb-theme");
          if (s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches)
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/dashboard/assets/index-C03yhf48.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard/assets/index-CnGGYVWL.css">
  </head>
  <body>
    <div id="root"></div>
      <!-- Loopback's own queue is a Loopback surface. Same origin as the hub, so
         the endpoint is relative and no configuration is needed. This page told
         users to "pin it" long before it actually loaded the widget. -->
    <script src="/widget.js" data-project="loopback"></script>
  </body>
</html>
