name: CI

on:
  push:
    branches: [main]
  pull_request:

# No untrusted event data is interpolated into run commands anywhere below.
jobs:
  build-smoke-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix dashboard
      - run: npm run build
      - run: npm run smoke
      - run: node scripts/init-gate.mjs
      - run: node scripts/registry-gate.mjs
      # Catches a committed dashboard build that has drifted from its source.
      - run: node scripts/dashboard-gate.mjs
      # The widget inlines its own copy of the tokens (it ships as one file and
      # cannot @import them), so it is the one surface that can drift silently.
      - run: node scripts/widget-token-gate.mjs
      # Design anti-patterns in the shipped UI. Runs after dashboard-gate
      # because it scans the built output, which that gate proves is current.
      - run: node scripts/impeccable-gate.mjs
      # Re-measures the numbers the docs assert (widget size, tool count, HTTP
      # routes, registry items). Every other gate checks structure; the drift
      # that actually accumulated was entirely in hand-typed figures.
      - run: node scripts/docs-facts-gate.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs
      # Measures contrast, target size, accessible names, landmarks and motion
      # in a real browser. Nothing else in CI asserts an a11y property, so every
      # fix in that class was previously defended by a one-time manual check.
      - run: node scripts/a11y-gate.mjs
