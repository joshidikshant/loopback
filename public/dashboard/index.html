<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loopback queue</title>
    <script>
      // Resolve the theme before first paint — a class applied after hydration
      // is the flash-of-wrong-theme bug this project has filed against others.
      (function () {
        try {
          var s = localStorage.getItem("lb-theme");
          if (s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches)
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/dashboard/assets/index-EMAfOleo.js"></script>
    <link rel="stylesheet" crossorigin href="/dashboard/assets/index-kK5uxCJj.css">
  </head>
  <body>
    <div id="root"></div>
      <!-- Loopback's own queue is a Loopback surface. No data-endpoint: the widget
         derives the hub from the origin of this very script tag, so it is
         correct under 127.0.0.1, a LAN bind, or a proxy. It used to fall through
         to an absolute 127.0.0.1:7077 default, which broke this page in the
         documented `--host 0.0.0.0` phone mode. -->
    <script src="/widget.js" data-project="loopback"></script>
  </body>
</html>
