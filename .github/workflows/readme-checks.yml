name: readme-checks
# Guards the two failure classes the growth-kit audit found in this repo's README:
# a dead link presented as evidence (the synthetic-PR caption), and — as a standing
# disqualifier — star-begging copy. Link-checks README + docs on change and weekly
# (external links rot on their own schedule).
# Security note: no untrusted event interpolation anywhere in this workflow —
# every run: command is static.
on:
  push:
    paths: ["README.md", "docs/**", "integrations/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  readme-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This step used to invoke linkinator directly and scanned ZERO links
      # while reporting success — extra path arguments are ignored, and the
      # bare 127.0.0.1 skip matched linkinator's own local server root. The
      # gate asserts a minimum link count per target so an empty crawl fails.
      - name: Link check (README, docs, integrations)
        run: node scripts/link-gate.mjs
      - name: Star-begging guard (growth-kit disqualifier class)
        run: |
          ! grep -riE "star (us|this|the repo)|give (us|it) a star|drop a star|smash[^.]*star" README.md docs integrations
